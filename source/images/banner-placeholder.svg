<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="900" viewBox="0 0 1920 900" role="img" aria-label="Abstract pale blue and purple gradient banner">
  <defs>
    <linearGradient id="bannerBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0ff"/>
      <stop offset="0.5" stop-color="#e2e7ff"/>
      <stop offset="1" stop-color="#dbe6fb"/>
    </linearGradient>
    <radialGradient id="bannerGlowBlue" cx="0.2" cy="0.25" r="0.75">
      <stop offset="0" stop-color="#bcd0fa" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#bcd0fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bannerGlowPurple" cx="0.82" cy="0.78" r="0.7">
      <stop offset="0" stop-color="#cbd2fa" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#cbd2fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bannerGlowLilac" cx="0.6" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#aab4f5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#aab4f5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="900" fill="url(#bannerBase)"/>
  <rect width="1920" height="900" fill="url(#bannerGlowBlue)"/>
  <rect width="1920" height="900" fill="url(#bannerGlowPurple)"/>
  <rect width="1920" height="900" fill="url(#bannerGlowLilac)"/>

  <g fill="#8795ee">
    <circle cx="330" cy="215" r="180" fill-opacity="0.10"/>
    <circle cx="1560" cy="640" r="240" fill-opacity="0.09"/>
    <circle cx="980" cy="130" r="120" fill-opacity="0.08"/>
  </g>
  <g fill="#6f7fe8">
    <circle cx="760" cy="700" r="150" fill-opacity="0.07"/>
    <circle cx="1400" cy="240" r="90" fill-opacity="0.08"/>
  </g>
  <g fill="#bcc4f8">
    <circle cx="1180" cy="780" r="200" fill-opacity="0.12"/>
    <circle cx="520" cy="430" r="70" fill-opacity="0.14"/>
  </g>
</svg>
