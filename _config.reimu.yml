theme_version_check: true
theme_config_check: true

menu:
  - name: home
    url: /
    icon: false
  - name: archives
    url: /archives
    icon: false
  - name: categories
    url: /categories
    icon: false
  - name: tags
    url: /tags
    icon: false
  - name: 项目
    url: /projects
    icon: false
  - name: about
    url: /about
    icon: false
  - name: friend
    url: /friend
    icon: false

avatar: avatar.jpg
banner: /images/banner-illustration.webp
cover: /images/default-campus-cover.webp
favicon: /images/site-favicon.ico
rss: atom.xml

subtitle:
  typing:
    enable: true
    strings:
      - 山中何事？松花酿酒，春水煎茶。
      - 今日鬓丝禅榻畔，茶烟轻飏落花风。
      - 井放辘轳闲浸酒，笼开鹦鹉报煎茶。
      - 被酒莫惊春睡重，赌书消得泼茶香。
      - 雪沫乳花浮午盏，蓼茸蒿笋试春盘。
      - 竹下忘言对紫茶，全胜羽客醉流霞。
      - 野泉烟火白云间，坐饮香茶爱此山。
    typeSpeed: 100
    backSpeed: 50
    backDelay: 2600
    startDelay: 300
    loop: true
    shuffle: false
    showCursor: true
    cursorChar: "|"
    smartBackspace: false

social:
  github: https://github.com/jingtine
  email: mailto:jingtineli@smail.nju.edu.cn
  rss: /jingtine-agent-site/atom.xml

open_graph:
  enable: true
  options:
    default_og_image: https://jingtine.github.io/jingtine-agent-site/images/default-campus-cover.webp

footer:
  since: 2026

sidebar:
  position: left
  menu: true
  article:
    show_common: true
widgets:
  - recent_posts
toc: true
toc_options:
  list_number: true
  min_depth: 2
  max_depth: 4
generator_search:
  enable: true
  field: post
  content: true

dark_mode:
  button: true
  type: auto
preloader:
  enable: true
  text:
    zh-CN: 茶香氤氲时...
animation:
  enable: true
pjax:
  enable: true
pace:
  enable: true
top:
  enable: true
  position: right
firework:
  enable: true
  disable_on_mobile: false
  options:
    excludeElements: ["a", "button"]
    particles:
      - shape: circle
        move: ["emit"]
        easing: easeOutExpo
        colors: ["#86efac", "#4ade80", "#22c55e", "#16a34a"]
        number: 20
        duration: [1200, 1800]
        shapeOptions:
          radius: [16, 32]
          alpha: [0.3, 0.5]
      - shape: circle
        move: ["diffuse"]
        easing: easeOutExpo
        colors: ["#22c55e"]
        number: 1
        duration: [1200, 1800]
        shapeOptions:
          radius: 20
          alpha: [0.2, 0.5]
          lineWidth: 6
live2d:
  enable: false
live2d_widgets:
  enable: false
reimu_cursor:
  enable: false
material_theme:
  enable: false

