theme_version_check: true
theme_config_check: true

menu:
  - name: home
    url: /
    icon: false
  - name: archives
    url: /archives
    icon: false
  - name: categories
    url: /categories
    icon: false
  - name: tags
    url: /tags
    icon: false
  - name: 项目
    url: /projects
    icon: false
  - name: about
    url: /about
    icon: false
  - name: friend
    url: /friend
    icon: false

avatar: avatar.jpg
banner: /images/banner-placeholder.svg
cover: /images/default-campus-cover.webp
rss: atom.xml

open_graph:
  enable: true
  options:
    default_og_image: https://jingtine.github.io/jingtine-agent-site/images/default-campus-cover.webp

sidebar:
  position: right
  menu: true
  article:
    show_common: true
widgets:
  - recent_posts
  - category
  - tag
toc: true
toc_options:
  list_number: true
  min_depth: 2
  max_depth: 4
generator_search:
  enable: true
  field: post
  content: true

dark_mode:
  button: true
  type: auto
animation:
  enable: true
pjax:
  enable: true
pace:
  enable: true
top:
  enable: true
  position: right
firework:
  enable: false
live2d:
  enable: false
live2d_widgets:
  enable: false
reimu_cursor:
  enable: false
material_theme:
  enable: false

player:
  position: before_sidebar
  disable_on_mobile: true
  aplayer:
    enable: false
    options:
      audio: []
  meting:
    enable: false

giscus:
  enable: false
waline:
  enable: false
valine:
  enable: false
twikoo:
  enable: false
gitalk:
  enable: false
disqus:
  enable: false
utterances:
  enable: false
beaudar:
  enable: false

internal_theme:
  light:
    --red-0: "#5968d8"
    --red-1: "#6f7fe8"
    --red-2: "#8795ee"
    --red-3: "#aab4f5"
    --red-4: "#cbd2fa"
    --red-5: "#e7eafe"
    --red-5-5: "#f0f1ff"
    --red-6: "#f7f8ff"
    --color-red-6-shadow: "rgba(111, 127, 232, 0.45)"
    --color-red-3-shadow: "rgba(135, 149, 238, 0.28)"
  dark:
    --red-0: "#9aa8f3"
    --red-1: "#aab4f5"
    --red-2: "#bcc4f8"
    --red-3: "#cdd3fa"
    --red-4: "rgba(170, 180, 245, 0.55)"
    --red-5: "rgba(135, 149, 238, 0.18)"
    --red-5-5: "rgba(111, 127, 232, 0.10)"
    --red-6: "rgba(89, 104, 216, 0.22)"

injector:
  head_end: '<link rel="stylesheet" href="/jingtine-agent-site/css/custom.css">'
  head_begin:
  body_begin:
  body_end: '<script src="/jingtine-agent-site/js/accessibility.js" defer></script>'
  sidebar_begin:
  sidebar_end:
